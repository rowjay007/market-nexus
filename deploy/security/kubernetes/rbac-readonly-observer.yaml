apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: marketnexus-readonly-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: marketnexus-readonly-observer-binding
subjects:
  - kind: ServiceAccount
    name: observability-bot
    namespace: marketnexus
roleRef:
  kind: ClusterRole
  name: marketnexus-readonly-observer
  apiGroup: rbac.authorization.k8s.io
