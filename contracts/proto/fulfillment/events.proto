syntax = "proto3";

package marketnexus.fulfillment.v1;

message FulfillmentScheduled {
  string event_id = 1;
  string order_id = 2;
  string vendor_id = 3;
  string address = 4;
  string occurred_at = 5;
}

message FulfillmentCancelled {
  string event_id = 1;
  string order_id = 2;
  string vendor_id = 3;
  string reason = 4;
  string occurred_at = 5;
}
