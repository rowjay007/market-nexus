syntax = "proto3";

package marketnexus.payment.v1;

message PaymentCaptured {
  string event_id = 1;
  string order_id = 2;
  string vendor_id = 3;
  int64 amount = 4;
  string occurred_at = 5;
}

message PaymentRefunded {
  string event_id = 1;
  string order_id = 2;
  string vendor_id = 3;
  int64 amount = 4;
  string reason = 5;
  string occurred_at = 6;
}
